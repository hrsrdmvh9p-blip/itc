<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mental Health Matters</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color:#f1c8e0;
      color: #d938a9;
      text-align: center;
      padding: 40px 20px;
    }
    h1 {
      color: #dd4ba3;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      max-width: 500px;
      margin: 30px auto;
    }
    button {
      background: #ee58a8;
      color: rgb(249, 249, 249);
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Your Mental Health Matters 🌸</h1>
  <p>You deserve care, kindness, and peace.</p>

  <div class="card">
    <h2>How are you feeling today?</h2>
    <p>Take a deep breath. It's okay to take things one step at a time.</p>
    <button onclick="alert('You matter. Take care of yourself, buseng!🌷')">
      A Little Reminder
    </button>
  </div>
</body>
</html>
